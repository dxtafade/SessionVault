<!doctype html>
<!--
  Landing page shown AFTER a user clicks the email-confirmation link.
  Supabase verifies the account, then redirects to its "Site URL" with tokens in
  the URL fragment (which we intentionally ignore — the extension does its own
  sign-in). Host this page (e.g. GitHub Pages) and set it as:
    Supabase → Authentication → URL Configuration → Site URL
  This replaces the default http://localhost:3000 that currently errors.

  NOTE: a web page cannot open a chrome-extension:// page (browser security), so
  we can't auto-redirect into the extension. Instead we tell the user to reopen
  the extension — where the email is already pre-filled (see Lucik's UI task).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email confirmed · Session Vault</title>
  <style>
    :root { color-scheme: light; }
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           background:#ECE7DE; color:#16140F;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .card { background:#FBF9F4; border:1px solid #E2DCD0; border-radius:16px;
            padding:40px 44px; max-width:420px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,.08); }
    .tag { font-size:12px; font-weight:700; letter-spacing:2px; color:#2D9D78; text-transform:uppercase; }
    .check { width:56px; height:56px; border-radius:50%; background:#2D9D78; margin:18px auto 8px;
             display:grid; place-items:center; color:#fff; font-size:28px; font-weight:700; }
    h1 { font-size:24px; font-weight:800; margin:14px 0 8px; letter-spacing:-0.3px; }
    p  { font-size:15px; line-height:1.6; color:#5A554C; margin:0; }
    .hint { margin-top:18px; font-size:13px; color:#8A847A; }
    .foot { margin-top:22px; font-size:11px; color:#A7A196; letter-spacing:.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Session Vault</div>
    <div class="check">✓</div>
    <h1>Email confirmed</h1>
    <p>Your account is ready. Head back to the <strong>Session Vault</strong> extension and sign in to start syncing your tabs.</p>
    <p class="hint">You can close this tab.</p>
    <p class="foot">Never lose your tabs again</p>
  </div>
</body>
</html>
