<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!--
    UI — owned by the UI developer.

    The UI talks to the backend ONLY through ./api.js (the adapter layer),
    never via chrome.runtime.sendMessage directly. When the Core Engine is
    ready the adapter switches from its mock to real messages automatically.
  -->

  <div id="app">
    <header>
      <h1>Session Vault</h1>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <!-- ─── Main view: sessions ─────────────────────────────────────────── -->
    <section id="view-main" class="view">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search sessions…" autocomplete="off" />
      </div>

      <main id="sessions-list" aria-live="polite">
        <!-- session cards rendered by popup.js -->
      </main>

      <footer>
        <button id="btn-save" class="btn-primary">＋ Save current session</button>
      </footer>
    </section>

    <!-- ─── Settings view ───────────────────────────────────────────────── -->
    <section id="view-settings" class="view" hidden>
      <div class="toolbar">
        <button id="btn-back" class="icon-btn" title="Back" aria-label="Back">←</button>
        <span class="toolbar-title">Settings</span>
      </div>

      <main class="settings">
        <label class="setting-row">
          <span class="setting-label">
            Autosave
            <small>Periodically snapshot your open tabs</small>
          </span>
          <input id="set-autosave" type="checkbox" />
        </label>

        <label class="setting-row">
          <span class="setting-label">
            Autosave interval
            <small>How often to snapshot, in minutes</small>
          </span>
          <input id="set-interval" type="number" min="1" max="1440" />
        </label>

        <label class="setting-row">
          <span class="setting-label">
            Keep autosaves
            <small>How many automatic snapshots to retain</small>
          </span>
          <input id="set-max-auto" type="number" min="1" max="100" />
        </label>

        <p id="settings-status" class="settings-status" hidden>Saved ✓</p>
      </main>
    </section>
  </div>

  <!-- ─── Modal (save name / confirm) ──────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-message" class="modal-message" hidden></p>
      <input id="modal-input" class="modal-input" type="text" hidden />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-confirm" class="btn-primary">OK</button>
      </div>
    </div>
  </div>

  <!-- dev-mode badge, shown only when the mock backend is active -->
  <div id="mock-badge" class="mock-badge" hidden>mock data</div>

  <script src="popup.js" type="module"></script>
</body>
</html>
